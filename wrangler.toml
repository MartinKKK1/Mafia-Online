# Настройки деплоя для worker.js (Cloudflare Workers)
name = "mafia-online"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# Username бота из BotFather БЕЗ символа @
BOT_USERNAME = "MartinMafiabot"
# Короткое имя приложения из BotFather (/newapp)
APP_SHORT_NAME = "mafia"
# "1" разрешает заходить из обычного браузера без Telegram (только для проверки). Для публикации поставьте "0".
ALLOW_GUESTS = "0"

# ВРЕМЕННО ДЛЯ ТЕСТА: токен бота вписан прямо сюда вместо секрета.
# Перед публикацией перенеси обратно в секрет:
#   npx wrangler secret put BOT_TOKEN --name mafia-online
#   (и удали эту строку из файла!)
# ВАЖНО: если ты уже делал Revoke в BotFather, этот токен мёртв —
# тогда вставь в кавычки АКТУАЛЬНЫЙ токен из BotFather.
BOT_TOKEN = "9160142390:AAGX2KCC7NwczqvBMJbfoOQNnVccDeWSkP0"

# Секрет вебхука: проверяется при вызове /telegram/webhook и /setup.
# Тоже временно здесь; перед публикацией — npx wrangler secret put WEBHOOK_SECRET
# и удалить строку. Запомни значение: оно нужно для ссылки /setup?secret=...
WEBHOOK_SECRET = "MafiaTestHook2026-Kd93nQ2xR8pLmZ5"

# Комнаты игры
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

# ПОРЯДОК ЗАПУСКА:
# 1. Пуш в GitHub → CI задеплоит автоматически (или npx wrangler deploy).
# 2. Открыть в браузере:
#    https://mafia-online.prsmsk.workers.dev/setup?secret=MafiaTestHook2026-Kd93nQ2xR8pLmZ5
#    Должны быть три блока "ok": true.
# 3. Бот → /start → «Играть» → «Создать комнату».
